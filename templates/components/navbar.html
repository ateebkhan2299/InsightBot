<!-- Top Navbar Component -->
<header class="app-header">
    <div class="header-left">
        <button id="mobile-menu-btn" class="icon-btn mobile-menu-toggle" style="display: none;">
            <i class="fas fa-bars"></i>
        </button>
        
        <div class="search-bar">
            <i class="fas fa-search" style="color: var(--text-muted);"></i>
            <form action="{{ url_for('api.articles') }}" method="GET" style="width: 100%; display: flex; margin-left: 0.5rem;">
                <input type="text" name="q" placeholder="Search news, topics, keywords... (Ctrl+K)" value="{{ query or '' }}">
            </form>
        </div>
    </div>
    
    <div class="header-right">
        <!-- Theme Toggle -->
        <button id="theme-toggle" class="icon-btn" title="Toggle Dark/Light Mode">
            <i class="fas fa-moon"></i>
        </button>
        
        <!-- Notifications -->
        <button class="icon-btn" title="Notifications" style="position: relative;">
            <i class="fas fa-bell"></i>
            <span style="position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--primary); border-radius: 50%;"></span>
        </button>
        
        <!-- User Profile Dropdown -->
        {% if session.get('user_id') %}
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-left: 1rem; padding-left: 1rem; border-left: 1px solid var(--border);">
                <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                    {{ session.get('username')[0]|upper if session.get('username') else 'U' }}
                </div>
                <div style="display: flex; flex-direction: column;">
                    <span style="font-weight: 600; font-size: 0.85rem;">{{ session.get('username') }}</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">{{ 'Administrator' if session.get('is_admin') else 'Researcher' }}</span>
                </div>
            </div>
        {% endif %}
    </div>
</header>
