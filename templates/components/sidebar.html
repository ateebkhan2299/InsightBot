<!-- Sidebar Component -->
<aside class="app-sidebar">
    <div class="sidebar-header">
        <a href="{{ url_for('api.dashboard') }}" class="sidebar-brand">
            <i class="fas fa-layer-group"></i> InsightBot
        </a>
    </div>
    
    <nav class="sidebar-nav">
        {% if session.get('user_id') %}
            <div style="padding: 0 1.5rem; margin-bottom: 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em;">Menu</div>
            
            <a href="{{ url_for('api.dashboard') }}" class="nav-item {% if request.endpoint == 'api.dashboard' %}active{% endif %}">
                <i class="fas fa-chart-pie"></i> 
                <span>Overview</span>
            </a>
            
            <a href="{{ url_for('api.articles') }}" class="nav-item {% if request.endpoint == 'api.articles' or request.endpoint == 'api.article_detail' %}active{% endif %}">
                <i class="fas fa-newspaper"></i> 
                <span>News Intelligence</span>
            </a>
            
            <a href="{{ url_for('api.dashboard') }}#scraper" class="nav-item">
                <i class="fas fa-spider"></i> 
                <span>Web Scraper</span>
            </a>
            
            {% if session.get('is_admin') %}
                <div style="padding: 0 1.5rem; margin: 1.5rem 0 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em;">Administration</div>
                
                <a href="{{ url_for('api.admin_dashboard') }}" class="nav-item {% if request.endpoint == 'api.admin_dashboard' %}active{% endif %}" style="color: var(--success);">
                    <i class="fas fa-shield-alt"></i> 
                    <span>Admin Panel</span>
                </a>
            {% endif %}
            
            <div style="padding: 0 1.5rem; margin: 1.5rem 0 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em;">User</div>
            
            <a href="{{ url_for('api.logout') }}" class="nav-item" style="color: var(--danger);">
                <i class="fas fa-sign-out-alt"></i> 
                <span>Logout</span>
            </a>
        {% else %}
            <div style="padding: 0 1.5rem; margin-bottom: 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em;">Account</div>
            
            <a href="{{ url_for('api.login') }}" class="nav-item {% if request.endpoint == 'api.login' %}active{% endif %}">
                <i class="fas fa-sign-in-alt"></i> 
                <span>Login</span>
            </a>
            
            <a href="{{ url_for('api.register') }}" class="nav-item {% if request.endpoint == 'api.register' %}active{% endif %}">
                <i class="fas fa-user-plus"></i> 
                <span>Register</span>
            </a>
        {% endif %}
    </nav>
</aside>
