{% extends "base.html" %}
{% block title %}{{ error_code }} — InsightBot{% endblock %}

{% block content %}
<div style="max-width:520px;margin:60px auto;text-align:center;">
    <div style="width:80px;height:80px;margin:0 auto 24px;background:var(--primary-light);border-radius:20px;display:flex;align-items:center;justify-content:center;">
        {% if error_code == 404 %}
            <i class="fas fa-search" style="font-size:32px;color:var(--primary);"></i>
        {% elif error_code == 403 %}
            <i class="fas fa-lock" style="font-size:32px;color:var(--accent-red);"></i>
        {% else %}
            <i class="fas fa-exclamation-triangle" style="font-size:32px;color:var(--accent-amber);"></i>
        {% endif %}
    </div>

    <div style="font-size:72px;font-weight:800;color:var(--text-primary);letter-spacing:-3px;line-height:1;margin-bottom:8px;">
        {{ error_code }}
    </div>

    <h2 style="font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:8px;">
        {{ error_title }}
    </h2>

    <p style="font-size:14px;color:var(--text-secondary);line-height:1.6;max-width:380px;margin:0 auto 28px;">
        {{ error_message }}
    </p>

    <div style="display:flex;gap:10px;justify-content:center;">
        <a href="{{ url_for('api.dashboard') }}" class="btn btn-primary">
            <i class="fas fa-home" style="font-size:11px;"></i>
            Back to Dashboard
        </a>
        <a href="{{ url_for('api.news_explorer') }}" class="btn btn-secondary">
            <i class="fas fa-newspaper" style="font-size:11px;"></i>
            Browse Articles
        </a>
    </div>
</div>
{% endblock %}
