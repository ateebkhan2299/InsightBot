{% extends "base.html" %}
{% block title %}Create Account — InsightBot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="p-8 sm:p-10 rounded-3xl bg-slate-900/90 border border-slate-800 shadow-2xl space-y-6">
        
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 text-xl mx-auto mb-3">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-heading font-bold text-white">Create Account</h2>
            <p class="text-xs text-slate-400 mt-1">Register for InsightBot intelligence access</p>
        </div>

        <form method="POST" action="{{ url_for('api.register') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" required placeholder="Choose a username"
                       class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
            </div>

            <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800 text-[11px] text-slate-400">
                <i class="fas fa-info-circle text-cyan-400 mr-1"></i>
                Accounts with username <strong class="text-slate-200">admin</strong> receive instant administrator approval.
            </div>

            <button type="submit" 
                    class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-cyan-600/20 transition-all flex items-center justify-center gap-2">
                <span>Register Account</span>
                <i class="fas fa-arrow-right text-[10px]"></i>
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
            Already registered? 
            <a href="{{ url_for('api.login') }}" class="text-cyan-400 hover:text-cyan-300 font-semibold ml-1">
                Sign In
            </a>
        </div>

    </div>
</div>
{% endblock %}
