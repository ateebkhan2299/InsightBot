{% extends "base.html" %}
{% block title %}Create Account — InsightBot{% endblock %}

{% block content %}
<div style="max-width:480px;margin:20px auto;">
    <div class="card" style="overflow:hidden;box-shadow:var(--shadow-lg);">

        <div style="padding:36px;display:flex;flex-direction:column;align-items:center;text-align:center;">
            <div style="width:48px;height:48px;background:var(--primary-light);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:20px;margin-bottom:16px;">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2 style="font-size:22px;font-weight:700;color:var(--text-primary);letter-spacing:-0.3px;">Create Account</h2>
            <p style="font-size:13.5px;color:var(--text-secondary);margin-top:4px;">Register for InsightBot intelligence access</p>
        </div>

        <div style="padding:0 36px 36px;">
            <form method="POST" action="{{ url_for('api.register') }}" style="display:flex;flex-direction:column;gap:16px;">
                <div>
                    <label class="form-label">Username</label>
                    <input type="text" name="username" required placeholder="Choose a username"
                           class="form-input">
                </div>

                <div>
                    <label class="form-label">Password</label>
                    <input type="password" name="password" required placeholder="Minimum 6 characters"
                           class="form-input">
                </div>

                <div style="padding:12px 14px;background:var(--primary-light);border:1px solid var(--primary-mid);border-radius:8px;font-size:13px;color:var(--primary-dark);display:flex;align-items:center;gap:8px;">
                    <i class="fas fa-info-circle" style="flex-shrink:0;"></i>
                    <span>Accounts with username <strong>admin</strong> receive instant administrator approval.</span>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                    Register Account
                    <i class="fas fa-arrow-right" style="font-size:12px;"></i>
                </button>
            </form>

            <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border-light);text-align:center;font-size:13.5px;color:var(--text-muted);">
                Already registered?
                <a href="{{ url_for('api.login') }}"
                   style="color:var(--primary);font-weight:600;text-decoration:none;margin-left:4px;">
                    Sign In
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
